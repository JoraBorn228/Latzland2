<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Soft outer glow for cyber dark UI -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="emeraldRadial" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#126839" />
      <stop offset="70%" stop-color="#094a26" />
      <stop offset="100%" stop-color="#053319" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe1a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <g transform="translate(500, 500)">
    <!-- 4 Cross Blades with Exact Heraldic Multi-Ring Contour -->
    <!-- We draw each petal at 0, 90, 180, 270 deg -->
    <!-- Each petal outer bounds: from r_inner=140 to r_outer=460, angle span ~ 44 degrees at tip, ~ 22 degrees at base -->

    <!-- Reusable petal macro -->
    <defs>
      <!-- Petal Path pointing UP (centered around angle -90 deg or along Y-axis) -->
      <!-- Center is (0,0). Up is -Y -->
      <!-- Let angle at base be +/- 13 deg (width = 140*sin(13) ~ 31.5 -> x = +/-31.5, y = -136.4) -->
      <!-- Flare out to r=460 with half-angle 23.5 deg: x = 460*sin(23.5) = 183.4, y = -460*cos(23.5) = -421.8 -->
      <!-- Outer cap is a circle arc with radius 460 from angle -113.5 to -66.5 deg -->
    </defs>

    <!-- 4 Rotations of the Blade -->
    <g id="blades">
      <!-- Petal Top (0 deg / Up) -->
      <path d="M -35 -145 L -195 -405 A 450 450 0 0 1 195 -405 L 35 -145 Z"
            fill="#ffb300" stroke="#ffb300" stroke-width="8" stroke-linejoin="round" />
      <path d="M -30 -150 L -185 -398 A 440 440 0 0 1 185 -398 L 30 -150 Z"
            fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
      <path d="M -23 -156 L -168 -386 A 424 424 0 0 1 168 -386 L 23 -156 Z"
            fill="#ffb300" stroke="#ffb300" stroke-width="4" stroke-linejoin="round" />
      <path d="M -16 -162 L -156 -378 A 410 410 0 0 1 156 -378 L 16 -162 Z"
            fill="url(#emeraldRadial)" stroke="#06381c" stroke-width="2" stroke-linejoin="round" />

      <!-- Petal Right (90 deg) -->
      <path d="M 145 -35 L 405 -195 A 450 450 0 0 1 405 195 L 145 35 Z"
            fill="#ffb300" stroke="#ffb300" stroke-width="8" stroke-linejoin="round" />
      <path d="M 150 -30 L 398 -185 A 440 440 0 0 1 398 185 L 150 30 Z"
            fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
      <path d="M 156 -23 L 386 -168 A 424 424 0 0 1 386 168 L 156 23 Z"
            fill="#ffb300" stroke="#ffb300" stroke-width="4" stroke-linejoin="round" />
      <path d="M 162 -16 L 378 -156 A 410 410 0 0 1 378 156 L 162 16 Z"
            fill="url(#emeraldRadial)" stroke="#06381c" stroke-width="2" stroke-linejoin="round" />

      <!-- Petal Bottom (180 deg) -->
      <path d="M -35 145 L -195 405 A 450 450 0 0 0 195 405 L 35 145 Z"
            fill="#ffb300" stroke="#ffb300" stroke-width="8" stroke-linejoin="round" />
      <path d="M -30 150 L -185 398 A 440 440 0 0 0 185 398 L 30 150 Z"
            fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
      <path d="M -23 156 L -168 386 A 424 424 0 0 0 168 386 L 23 156 Z"
            fill="#ffb300" stroke="#ffb300" stroke-width="4" stroke-linejoin="round" />
      <path d="M -16 162 L -156 378 A 410 410 0 0 0 156 378 L 16 162 Z"
            fill="url(#emeraldRadial)" stroke="#06381c" stroke-width="2" stroke-linejoin="round" />

      <!-- Petal Left (270 deg) -->
      <path d="M -145 -35 L -405 -195 A 450 450 0 0 0 -405 195 L -145 35 Z"
            fill="#ffb300" stroke="#ffb300" stroke-width="8" stroke-linejoin="round" />
      <path d="M -150 -30 L -398 -185 A 440 440 0 0 0 -398 185 L -150 30 Z"
            fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
      <path d="M -156 -23 L -386 -168 A 424 424 0 0 0 -386 168 L -156 23 Z"
            fill="#ffb300" stroke="#ffb300" stroke-width="4" stroke-linejoin="round" />
      <path d="M -162 -16 L -378 -156 A 410 410 0 0 0 -378 156 L -162 16 Z"
            fill="url(#emeraldRadial)" stroke="#06381c" stroke-width="2" stroke-linejoin="round" />
    </g>

    <!-- Central Concentric Medallion Rings -->
    <!-- Outer Gold Ring -->
    <circle r="148" fill="#ffb300" stroke="#ffb300" stroke-width="2" />
    <!-- Middle White Ring -->
    <circle r="136" fill="#ffffff" />
    <!-- Inner Gold Ring -->
    <circle r="114" fill="#ffb300" />
    <!-- Emerald Core Center -->
    <circle r="102" fill="url(#emeraldRadial)" stroke="#06381c" stroke-width="2" />
  </g>
</svg>
